name: Leads Reminder V3 APK
on:
  push:
    branches: [ feature/leads-reminder-v3 ]
    paths: [ 'mobile/**', '.github/workflows/lrs-lead-ai-apk.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'
      - name: Build Leads Reminder V3 APK
        working-directory: mobile
        run: gradle clean :app:assembleDebug --stacktrace
      - name: Verify V3 identity and logo assets
        run: |
          APK=mobile/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.lrsmotors.leads' versionCode='320' versionName='3.2.0'" apk-badging.txt
          grep -q "application-label:'Leads/Reminder'" apk-badging.txt
          unzip -l "$APK" | grep -q 'res/drawable.*/lrs_app_logo'
          unzip -l "$APK" | grep -q 'res/drawable.*/ic_launcher_foreground'
      - name: Rename APK
        run: cp mobile/app/build/outputs/apk/debug/app-debug.apk Leads-Reminder-v3.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Leads-Reminder-v3.2.0
          path: Leads-Reminder-v3.2.0.apk
          retention-days: 30
