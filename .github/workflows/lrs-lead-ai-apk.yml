name: LRS Lead AI APK
on:
  push:
    branches: [ feature/lrs-lead-ai-mobile ]
    paths: [ 'mobile/**', '.github/workflows/lrs-lead-ai-apk.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: mobile
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp mobile/app/build/outputs/apk/debug/app-debug.apk LRS-Lead-AI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LRS-Lead-AI-APK
          path: LRS-Lead-AI.apk
          retention-days: 30